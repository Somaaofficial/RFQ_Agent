services:
  - type: web
    name: rfq-agent-api
    env: python
    plan: free
    pythonVersion: "3.11"
    startCommand: gunicorn -w 1 -b 0.0.0.0:10000 rfq_agent.api:app
    buildCommand: pip install -r requirements.txt
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11
